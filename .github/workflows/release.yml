name: Release

# Builds FIP.app from the tagged sources and attaches it (zipped, with a
# SHA-256 checksum) to the GitHub Release, so users never have to trust a
# binary committed to the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal FIP.app
        run: UNIVERSAL=1 ./bundle.sh
      - name: Package
        run: |
          ditto -c -k --keepParent FIP.app "FIP-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "FIP-${GITHUB_REF_NAME}.zip" > "FIP-${GITHUB_REF_NAME}.zip.sha256"
          cat "FIP-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FIP-${{ github.ref_name }}.zip
            FIP-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
